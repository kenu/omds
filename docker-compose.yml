services:
  omd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omd-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount directories so updates are reflected in real-time
      - ./md:/app/md:ro
      - ./views:/app/views:ro
      - ./public:/app/public:ro
      - ./lib:/app/lib:ro
      - ./server.js:/app/server.js:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
